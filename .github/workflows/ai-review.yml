name: ai-review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.body == '/review')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: AdolfoVillalobos/adolfo-code-review@main
        with:
          github-token: ${{ github.token }}
          doppler-token: ${{ secrets.DOPPLER_REVIEW_TOKEN }}
